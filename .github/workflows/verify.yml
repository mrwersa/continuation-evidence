name: Artifact verification

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: artifact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify evidence and generated outputs
        run: |
          python3 make_tables.py --check
          python3 verify_revision.py
          python3 verify_continuation.py
          python3 verify_apigee.py
          python3 continuation_model.py
          python3 compare_recovery.py --check
          python3 harness/check_harness.py
      - name: Run artifact tests
        run: |
          python3 -m unittest discover -s . -p 'test_scope.py' -v
          python3 -m unittest discover -s . -p 'test_coordinator.py' -v
          python3 -m unittest test_apigee -v
          python3 -m unittest discover -s harness -p 'test_harness.py' -v
      - name: Check documentation links and link-checker tests
        run: |
          python3 .github/scripts/check_docs.py
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Check that verification leaves tracked files unchanged
        run: git diff --exit-code
